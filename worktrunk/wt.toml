# Worktrunk PROJECT config — reusable TEMPLATE.
#
# TO USE: copy this file to  <project-root>/.config/wt.toml  and commit it in THAT project's
# git. It must live at worktrunk's DEFAULT path (.config/wt.toml at the repo root) and be
# tracked there, because hooks resolve from the *invoking* worktree's own working-tree copy —
# that is what makes `wt switch --create` seed a new worktree out of the box, from any shell
# and any worktree.
#
# AIDEV-NOTE: do NOT run it from here. Worktrunk does not read .claude/ (it reads
# <repo>/.config/wt.toml), and .claude/ is its own git repo, so a copy left only here is absent
# from a fresh worktree exactly when the hook is needed. Keep this as the canonical template and
# deploy a copy per project. The hook scripts stay in .claude/worktrunk/ and are reached by
# absolute path via {{ primary_worktree_path }}, which always points at the primary worktree.

# post-start: runs in the background just AFTER a new worktree is created. Seeds the worktree
# via our own script, passing the primary worktree path as $1.
[post-start]
setup = "{{ primary_worktree_path }}/.claude/worktrunk/post-start.sh {{ primary_worktree_path }}"

# pre-remove: blocking hook that unmounts any bind mounts (e.g. a results:ro share) BEFORE
# `wt remove`, else removal fails on the busy mountpoint. Runs in the worktree being removed.
[pre-remove]
unmount = "{{ primary_worktree_path }}/.claude/worktrunk/pre-remove.sh"
